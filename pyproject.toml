[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "team-knowledge-base-poc"
version = "0.1.0"
description = "A traceable and testable team knowledge base proof of concept"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bm25s==0.3.11",
  "httpx>=0.28,<1",
  "jieba==0.42.1",
  "numpy>=2.1,<3",
  "qdrant-client==1.19.0",
  "sentence-transformers==6.0.1",
]

[tool.setuptools]
py-modules = []
